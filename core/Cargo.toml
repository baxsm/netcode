[package]
name = "netcode-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fixed = "1.31.0"
rand = { version = "0.10.2", default-features = false }
rand_chacha = { version = "0.10.0", default-features = false }
wasm-bindgen = "0.2.127"

[dev-dependencies]
proptest = "1.11.0"
fixed = "1.31.0"

[profile.release]
# wrapping fixed-point arithmetic produces plausible wrong motion instead of an
# error, so overflow must trap in release too, not just debug
overflow-checks = true

[profile.test]
overflow-checks = true
